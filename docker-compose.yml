version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kathakosh_db
    environment:
      POSTGRES_DB: katha_kosh
      POSTGRES_USER: katha_user
      POSTGRES_PASSWORD: katha_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katha_user -d katha_kosh"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kathakosh_backend
    environment:
      DATABASE_URL: postgresql://katha_user:katha_password@db/katha_kosh
      SECRET_KEY: your-production-secret-key-change-this
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kathakosh_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  postgres_data:
  upload_data:

